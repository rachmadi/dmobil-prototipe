    /* ==========================================================================

       ========================================================================== */
    function formatRupiah(num) {
      return 'Rp ' + Number(num || 0).toLocaleString('id-ID');
    }

    function showMobileSnackbar(msg, icon = 'check_circle') {
      const sb = document.getElementById('mobile-snackbar');
      document.getElementById('mobile-sb-text').textContent = msg;
      document.getElementById('mobile-sb-icon').textContent = icon;
      sb.classList.remove('hidden');
      clearTimeout(window._mobSbTimer);
      window._mobSbTimer = setTimeout(() => {
        sb.classList.add('hidden');
      }, 3200);
    }

    function switchTab(tab) {
      state.activeTab = tab;
      renderApp();
    }

    function closeMobileSheet() {
      document.getElementById('mobile-sheet-backdrop').classList.add('hidden');
    }

    function getSelectedVehicle() {
      if (state.customer.vehicles.length === 0) return null;
      if (state.selectedVehicleIndex >= state.customer.vehicles.length) {
        state.selectedVehicleIndex = 0;
      }
      return state.customer.vehicles[state.selectedVehicleIndex];
    }

    function getSelectedLocation() {
      if (state.locations.length === 0) return null;
      if (state.selectedLocationIndex >= state.locations.length) {
        state.selectedLocationIndex = 0;
      }
      return state.locations[state.selectedLocationIndex];
    }

    function startCancelCountdownLoop() {
      if (window._cancelTicker) return;
      window._cancelTicker = setInterval(() => {
        const now = Date.now();
        let hasActiveWindow = false;
        let expiredJustNow = false;

        state.bookingsAndServices.forEach(item => {
          if (item.status === 'PENDING' && item.cancelDeadlineMs > 0) {
            const remSec = Math.ceil((item.cancelDeadlineMs - now) / 1000);
            if (remSec > 0) {
              hasActiveWindow = true;
              const labelEl = document.getElementById(`cancel-countdown-${item.id}`);
              if (labelEl) {
                labelEl.textContent = `${remSec}d`;
              }
            } else {
              item.cancelDeadlineMs = 0;
              expiredJustNow = true;
            }
          }
        });

        if (expiredJustNow && state.activeTab === 'aktivitas') {
          renderApp();
        }
        if (!hasActiveWindow) {
          clearInterval(window._cancelTicker);
          window._cancelTicker = null;
        }
      }, 1000);
    }

    function cancelBookingWithinWindow(bookingId) {
      const item = state.bookingsAndServices.find(b => b.id === bookingId);
      if (!item || item.status !== 'PENDING') return;
      if (Date.now() > item.cancelDeadlineMs) {
        item.cancelDeadlineMs = 0;
        renderApp();
        showMobileSnackbar('Batas waktu pembatalan 1 menit telah berakhir.', 'error');
        return;
      }
      item.status = 'CANCELLED';
      item.cancelDeadlineMs = 0;
      renderApp();
      showMobileSnackbar(`Booking ${bookingId} berhasil dibatalkan.`, 'cancel');
    }

    function submitCustomerBooking(e) {
      e.preventDefault();
      const newId = `BK-2026-0${82 + state.bookingsAndServices.length}`;
      const selectedLocationName = document.getElementById('bk-location-select').value;
      state.bookingsAndServices.unshift({
        id: newId,
        type: 'BOOKING',
        locationName: selectedLocationName,

        method,
        distanceKm: m.distanceKm,
        time: 'Baru saja'
      });
      showMobileSnackbar(
        method === 'WHATSAPP'

    function submitAddCustomerVehicle(e, returnToBooking) {
      e.preventDefault();
      state.customer.vehicles.push({
        id: 'veh_' + Date.now(),
        plateNumber: document.getElementById('new-veh-plate').value.trim().toUpperCase(),
        brand: document.getElementById('new-veh-brand').value.trim(),
        model: document.getElementById('new-veh-model').value.trim(),
        year: document.getElementById('new-veh-year').value.trim(),
        color: document.getElementById('new-veh-color').value.trim() || '-',

    function deleteCustomerVehicle(vehId) {
      if (state.customer.vehicles.length <= 1) return;
      state.customer.vehicles = state.customer.vehicles.filter(v => v.id !== vehId);
      state.selectedVehicleIndex = 0;
      renderApp();
      showMobileSnackbar('Kendaraan dihapus dari Garasi Saya.');

    /* ==========================================================================
       8. TAB 4: AKTIVITAS, STATUS BOOKING & RATING/ULASAN PELANGGAN
       ========================================================================== */
    function renderAktivitasTab() {
      const statusBadgeMap = {
        PENDING: { label: 'Menunggu Konfirmasi DM', cls: 'bg-amber-100 text-amber-900' },
        RESCHEDULE_OFFERED: { label: 'Slot Penuh • Usulan Jadwal Baru', cls: 'bg-orange-100 text-orange-900' },
        CONFIRMED: { label: 'Jadwal Dikonfirmasi', cls: 'bg-blue-100 text-blue-900' },
        CANCELLED: { label: 'Dibatalkan Pelanggan', cls: 'bg-red-100 text-red-800' },
        CONVERTED_TO_JOB: { label: 'Diteruskan ke Mekanik', cls: 'bg-emerald-100 text-emerald-900' },
        COMPLETED: { label: 'Servis Selesai', cls: 'bg-slate-200 text-slate-800' }
      };

      const now = Date.now();

      return `
        <div class="px-4 pt-3 pb-3 bg-white border-b border-md-outlineVariant/60">
          <h1 class="text-sm font-bold text-md-onSurface">Booking & Riwayat Servis</h1>
          <p class="text-[11px] text-md-onSurfaceVariant">Pantau status jadwal bengkel & berikan ulasan hasil pengerjaan</p>
        </div>

        <div class="p-4 space-y-3">
          ${state.bookingsAndServices.map(item => {
            const st = statusBadgeMap[item.status] || statusBadgeMap.PENDING;
            const remainingCancelSec = (item.status === 'PENDING' && item.cancelDeadlineMs > now)
              ? Math.ceil((item.cancelDeadlineMs - now) / 1000)
              : 0;

            return `
              <div class="bg-white rounded-2xl p-4 border border-md-outlineVariant/70 shadow-2xs space-y-2.5 text-xs ${item.status === 'CANCELLED' ? 'opacity-70' : ''}">
                <div class="flex items-center justify-between gap-2">
                  <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold ${st.cls}">${st.label}</span>
                  <span class="font-mono text-[10px] text-md-onSurfaceVariant">${item.id}</span>
                </div>

                <div>
                  <span class="text-[10px] font-bold text-md-primary uppercase">${item.categoryName} • ${item.locationName}</span>
                  <h4 class="font-bold text-sm text-md-onSurface mt-0.5">${item.complaint}</h4>
                  <p class="text-[11px] text-md-secondary font-medium mt-0.5">${item.vehicleInfo}</p>
                </div>

                <div class="p-2.5 rounded-xl bg-md-surfaceContainer text-[11px] space-y-1">
                  <div class="flex justify-between">
                    <span class="text-md-onSurfaceVariant">Jadwal Diminta:</span>
                    <strong class="text-md-onSurface">${item.scheduledDate}</strong>
                  </div>
                  ${item.proposedSchedule ? `
                    <div class="flex justify-between">
                      <span class="text-md-onSurfaceVariant">Usulan Jadwal DM:</span>
                      <strong class="text-orange-800">${item.proposedSchedule}</strong>
                    </div>
                  ` : ''}
                  ${item.mechanicName ? `
                    <div class="flex justify-between">
                      <span class="text-md-onSurfaceVariant">Mekanik Pelaksana:</span>
                      <strong class="text-md-onSurface">${item.mechanicName}</strong>
                    </div>
                  ` : ''}
                  ${item.totalPrice ? `
                    <div class="flex justify-between">
                      <span class="text-md-onSurfaceVariant">Total Biaya Jasa (Kasir DM):</span>
                      <strong class="text-md-tertiary font-bold">${formatRupiah(item.totalPrice)}</strong>
                    </div>
                  ` : ''}
                </div>

                ${remainingCancelSec > 0 ? `
                  <button onclick="cancelBookingWithinWindow('${item.id}')" class="w-full py-2 px-3 rounded-xl text-[11px] font-bold bg-red-50 hover:bg-red-100 text-md-primary border border-red-200 flex items-center justify-center gap-1.5">
                    <span class="material-symbols-outlined text-sm">cancel</span>
                    <span>Batalkan Booking (<span id="cancel-countdown-${item.id}">${remainingCancelSec}d</span>)</span>
                  </button>
                ` : ''}

                ${item.adminResponseNote ? `
                  <div class="p-2.5 rounded-xl ${item.status === 'RESCHEDULE_OFFERED' ? 'bg-orange-50 border border-orange-200 text-orange-950' : 'bg-blue-50/80 border border-blue-200 text-blue-950'} text-[11px]">
                    <span class="text-[10px] font-bold uppercase block mb-0.5">Pesan Admin Dokter Mobil:</span>
                    <p class="leading-snug">"${item.adminResponseNote}"</p>
                  </div>
                ` : ''}

                ${item.status === 'RESCHEDULE_OFFERED' ? `
                  <button onclick="acceptProposedSchedule('${item.id}')" class="w-full py-2.5 px-4 rounded-xl text-xs font-bold bg-md-secondary hover:bg-blue-900 text-white shadow-2xs flex items-center justify-center gap-1.5">
                    <span class="material-symbols-outlined text-base">event_available</span>
                    <span>Setujui Jadwal Baru (${item.proposedSchedule})</span>
                  </button>
              <button onclick="rejectProposedSchedule('${item.id}')" class="w-full py-2.5 rounded-full border border-md-primary text-md-primary bg-white text-xs font-bold flex items-center justify-center gap-1.5 active:scale-95">
                <span class="material-symbols-outlined text-base">event_busy</span>
                <span>Tolak &amp; Batalkan Booking</span>
              </button>
                ` : ''}

                ${item.status === 'COMPLETED' && !item.isReviewed ? `
                  <button onclick="openRatingSheet('${item.id}')" class="w-full py-2.5 px-4 rounded-xl text-xs font-bold bg-amber-500 hover:bg-amber-600 text-white shadow-2xs flex items-center justify-center gap-1.5">
                    <span class="material-symbols-outlined text-base icon-filled">star</span>
                    <span>Beri Rating & Ulasan Mekanik</span>
                  </button>
                ` : ''}

                ${item.status === 'COMPLETED' && item.isReviewed ? `
                  <div class="p-2.5 rounded-xl bg-amber-50/70 border border-amber-200/80 text-[11px]">
                    <div class="flex items-center justify-between">
                      <span class="font-semibold text-amber-950">Ulasan Anda:</span>
                      <span class="font-bold text-amber-600">${'★'.repeat(item.rating)}${'☆'.repeat(5 - item.rating)} (${item.rating}.0)</span>
                    </div>
                    ${item.reviewComment ? `<p class="text-md-onSurfaceVariant italic mt-1">"${item.reviewComment}"</p>` : ''}
                  </div>
                ` : ''}
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function acceptProposedSchedule(bookingId) {
      const item = state.bookingsAndServices.find(b => b.id === bookingId);
      if (!item || !item.proposedSchedule) return;
      item.scheduledDate = item.proposedSchedule;
      item.proposedSchedule = null;
      item.status = 'CONFIRMED';
      item.adminResponseNote = 'Pelanggan menyetujui jadwal pengganti. Slot telah dikunci.';
      renderApp();
      showMobileSnackbar(`Jadwal baru (${item.scheduledDate}) berhasil dikonfirmasi!`);
    }

    function rejectProposedSchedule(bookingId) {
      const item = state.bookingsAndServices.find(b => b.id === bookingId);
      if (!item || item.status !== 'RESCHEDULE_OFFERED') return;
      item.proposedSchedule = null;
      item.adminResponseNote = '';
      item.status = 'CANCELLED';
      renderApp();
      showMobileSnackbar(`Usulan jadwal ditolak. Booking ${item.id} dibatalkan.`, 'event_busy');
    }

    function openRatingSheet(serviceId) {
      const item = state.bookingsAndServices.find(b => b.id === serviceId);
      if (!item) return;
      window._selectedRating = 5;

      document.getElementById('mobile-sheet-content').innerHTML = `
        <div class="w-10 h-1 rounded-full bg-gray-300 mx-auto mb-3"></div>
        <h3 class="text-base font-bold text-md-onSurface">Beri Penilaian Layanan</h3>
        <p class="text-xs text-md-onSurfaceVariant mt-0.5">Bagaimana hasil pengerjaan mekanik <strong>${item.mechanicName}</strong> pada <strong>${item.vehicleInfo}</strong>?</p>

        <form onsubmit="submitCustomerRating(event, '${item.id}')" class="mt-4 space-y-4 text-xs">
          <div class="flex items-center justify-center gap-2 py-2">
            ${[1, 2, 3, 4, 5].map(star => `
              <button type="button" onclick="selectStarRating(${star})" id="star-btn-${star}" class="p-1 text-amber-400 transition transform active:scale-90">
                <span class="material-symbols-outlined text-4xl icon-filled">star</span>
              </button>
            `).join('')}
          </div>

          <div>
            <label class="block font-semibold text-md-onSurfaceVariant mb-1">Ulasan Anda (Opsional)</label>
            <textarea id="rating-comment-input" rows="2" placeholder="Ceritakan pengalaman servis Anda..." class="w-full rounded-xl border border-md-outline bg-white px-3 py-2 text-xs"></textarea>
          </div>

          <div class="flex items-center gap-2">
            <button type="button" onclick="closeMobileSheet()" class="px-4 py-2.5 rounded-full font-semibold text-md-onSurfaceVariant bg-gray-100">Nanti</button>
            <button type="submit" class="flex-1 py-2.5 px-5 rounded-full font-bold bg-md-primary text-white shadow-sm">
              Kirim Ulasan
            </button>
          </div>
        </form>
      `;
      document.getElementById('mobile-sheet-backdrop').classList.remove('hidden');
    }

    function selectStarRating(val) {
      window._selectedRating = val;
      for (let i = 1; i <= 5; i++) {
        const btn = document.getElementById(`star-btn-${i}`);
        if (btn) {
          btn.className = `p-1 transition transform active:scale-90 ${i <= val ? 'text-amber-400' : 'text-gray-300'}`;
        }
      }
    }

    function submitCustomerRating(e, serviceId) {
      e.preventDefault();
      const item = state.bookingsAndServices.find(b => b.id === serviceId);
      if (!item) return;
      item.isReviewed = true;
      item.rating = window._selectedRating || 5;
      item.reviewComment = document.getElementById('rating-comment-input').value.trim();

      closeMobileSheet();
      renderApp();
      showMobileSnackbar(`Terima kasih! Penilaian ${item.rating} bintang untuk ${item.mechanicName} berhasil dikirim.`);
    }

        </div>
        <div class="mt-4 flex items-center gap-2">
          <button onclick="logoutCustomer()" class="px-4 py-2.5 rounded-full text-xs font-semibold text-md-primary border border-md-outlineVariant hover:bg-red-50">
            Keluar Akun
          </button>
          <button onclick="closeMobileSheet()" class="flex-1 py-2.5 rounded-full text-xs font-bold bg-md-surfaceContainerHigh text-md-onSurface">
            Tutup Profil
          </button>
        </div>
      `;
      document.getElementById('mobile-sheet-backdrop').classList.remove('hidden');
    }

    function simulateAdminConfirmBooking() {
      const pending = state.bookingsAndServices.find(b => b.status === 'PENDING');
      if (pending) {
        pending.cancelDeadlineMs = 0;
        pending.status = 'RESCHEDULE_OFFERED';
        pending.proposedSchedule = 'Besok, 10:00 WIB';
        pending.adminResponseNote = 'Mohon maaf, slot pukul 15:00 WIB sudah penuh dengan antrean servis lain. Apakah berkenan dialihkan ke Besok pukul 10:00 WIB?';
        state.activeTab = 'aktivitas';
        renderApp();
        showMobileSnackbar(`Admin DM membalas: Slot penuh & mengusulkan jadwal baru!`, 'schedule');
        return;
      }

      const rescheduled = state.bookingsAndServices.find(b => b.status === 'RESCHEDULE_OFFERED');
      if (rescheduled) {
        acceptProposedSchedule(rescheduled.id);
        return;
      }

      const confirmed = state.bookingsAndServices.find(b => b.status === 'CONFIRMED');
      if (confirmed) {
        confirmed.status = 'COMPLETED';
        confirmed.mechanicName = 'Agus Setiawan';
        confirmed.totalPrice = 550000;
        state.activeTab = 'aktivitas';
        renderApp();
        showMobileSnackbar(`Servis ${confirmed.id} selesai! Silakan beri rating & ulasan.`);
        return;
      }

      showMobileSnackbar('Semua booking aktif sudah selesai. Buat booking baru dari tab Beranda.', 'info');
    }

    /* ==========================================================================
       10. MAIN RENDER ORCHESTRATOR
       ========================================================================== */
    function renderApp() {
      const sb = document.getElementById('status-bar');
      if (!state.isLoggedIn || state.activeTab !== 'beranda') {
        sb.className = 'relative z-40 h-8 px-5 pt-1 bg-white text-md-onSurface flex items-center justify-between text-[11px] font-semibold shrink-0 transition-colors';
      } else {
        sb.className = 'relative z-40 h-8 px-5 pt-1 bg-[#162844] text-white flex items-center justify-between text-[11px] font-semibold shrink-0 transition-colors';
      }

      renderBottomNav();
      const screen = document.getElementById('app-screen');
      if (!state.isLoggedIn) {
        screen.innerHTML = renderCustomerLoginScreen();
        return;
      }
      if (state.activeTab === 'beranda') {
        screen.innerHTML = renderBerandaTab();
      } else if (state.activeTab === 'onsite') {
        screen.innerHTML = renderOnSiteTab();
      } else if (state.activeTab === 'garasi') {
        screen.innerHTML = renderGarasiTab();
      } else if (state.activeTab === 'aktivitas') {
        screen.innerHTML = renderAktivitasTab();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderApp();
    });
  </script>
